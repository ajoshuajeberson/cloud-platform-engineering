name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build -o cloud-platform-api .

      - name: Build Docker image
        working-directory: .
        run: docker build -t cloud-platform-api:ci ./application

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-platform-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/cloud-platform-api

          docker tag cloud-platform-api:ci $IMAGE_NAME:${{ github.sha }}
          docker tag cloud-platform-api:ci $IMAGE_NAME:latest

          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    name: Deploy to Kubernetes
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy image to Kubernetes
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/cloud-platform-api

          kubectl set image deployment/cloud-platform-api \
            cloud-platform-api=$IMAGE_NAME:${{ github.sha }} \
            -n cloud-platform

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/cloud-platform-api \
            -n cloud-platform \
            --timeout=180s

      - name: Verify application pods
        run: |
          kubectl get pods -n cloud-platform
