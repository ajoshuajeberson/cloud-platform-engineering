apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-platform-api
  namespace: cloud-platform
spec:
  ingressClassName: nginx
  rules:
    - host: cloud-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-platform-api
                port:
                  number: 80
